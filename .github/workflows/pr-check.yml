name: PR Code Verification

on:
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read
  pull-requests: write

jobs:
  verify-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.[jt]s', '**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run TypeScript type check
        id: ts_check
        continue-on-error: true
        run: npx tsc --noEmit

      - name: Run ESLint
        id: eslint_check
        continue-on-error: true
        run: npm run lint

      - name: Run Next.js build
        id: build_check
        continue-on-error: true
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/dummy"
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build

      - name: Post or Update PR Comment
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const tsOutcome = "${{ steps.ts_check.outcome }}";
            const eslintOutcome = "${{ steps.eslint_check.outcome }}";
            const buildOutcome = "${{ steps.build_check.outcome }}";

            const tsStatus = tsOutcome === 'success' ? '✅ Passed' : '❌ Failed';
            const eslintStatus = eslintOutcome === 'success' ? '✅ Passed' : '❌ Failed';
            const buildStatus = buildOutcome === 'success' ? '✅ Passed' : '❌ Failed';

            const isAllPassed = tsOutcome === 'success' && eslintOutcome === 'success' && buildOutcome === 'success';

            const summary = isAllPassed
              ? 'All checks passed successfully! This PR is ready for review and merge. 🚀'
              : 'Some checks failed. Please review the errors before merging. ⚠️';

            const commentHeader = '### 🔍 Pull Request Verification Results';
            const body = `${commentHeader}

            | Test Step | Status |
            | :--- | :--- |
            | **TypeScript Check** | ${tsStatus} |
            | **ESLint Check** | ${eslintStatus} |
            | **Next.js Build** | ${buildStatus} |

            **Summary:** ${summary}`;

            try {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
              });

              const botComment = comments.find(comment => comment.body.includes(commentHeader));

              if (botComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id,
                  body: body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.pull_request.number,
                  body: body,
                });
              }
            } catch (error) {
              console.log('Failed to post PR comment (e.g. PR from fork):', error.message);
            }

            if (!isAllPassed) {
              core.setFailed('One or more verification checks failed.');
            }

