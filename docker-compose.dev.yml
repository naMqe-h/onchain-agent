services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
      - /app/.eve
    ports:
      - "3000:3000"
    env_file:
      - .env
    command: sh -c "npm install && npm run dev"
    environment:
      - WATCHPACK_POLLING=false
      - CHOKIDAR_USEPOLLING=false
